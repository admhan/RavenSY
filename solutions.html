<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RavenSY | Solutions</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="brand">
          <div class="brand-icon"><span>R</span></div>
          <div>
            <div>RavenSY</div>
            <small data-i18n="nav.tagline">Future of reliable technology</small>
          </div>
        </div>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        <nav>
          <ul>
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li><a href="services.html" data-i18n="nav.services"></a></li>
            <li><a href="solutions.html" data-i18n="nav.solutions"></a></li>
            <li><a href="contact.html" data-i18n="nav.contact"></a></li>
          </ul>
        </nav>
        <div class="controls">
          <div class="language-switcher" aria-label="Language selector">
            <button data-lang="fr">FR</button>
            <button data-lang="en">EN</button>
            <button data-lang="es">ES</button>
            <button data-lang="ar">AR</button>
          </div>
          <a class="cta" href="#contact" data-i18n="nav.cta"></a>
        </div>
      </div>
    </header>

    <main>
      <section class="section hero fade-in" id="hero">
        <div>
          <div class="badge" data-i18n="solutions.hero.badge"></div>
          <h1 data-i18n="solutions.hero.title"></h1>
          <p data-i18n="solutions.hero.subtitle"></p>
          <div class="hero-actions">
            <a class="cta" href="#contact" data-i18n="hero.primary"></a>
            <a class="cta" href="#services" style="background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px rgba(53, 228, 255, 0.25);" data-i18n="hero.secondary"></a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-grid">
            <div class="hero-card">
              <div class="icon">⚡</div>
              <p data-i18n="hero.stats.speed"></p>
            </div>
            <div class="hero-card">
              <div class="icon">🔒</div>
              <p data-i18n="hero.stats.security"></p>
            </div>
            <div class="hero-card">
              <div class="icon">🧠</div>
              <p data-i18n="hero.stats.ai"></p>
            </div>
            <div class="hero-card">
              <div class="icon">🌐</div>
              <p data-i18n="hero.stats.global"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="services">
        <div class="section-header">
          <h2 class="section-title" data-i18n="services.title"></h2>
          <p class="section-subtitle" data-i18n="services.subtitle"></p>
        </div>
        <div class="grid grid-3">
          <div class="card">
            <div class="icon">01</div>
            <h3 data-i18n="services.card1.title"></h3>
            <p data-i18n="services.card1.desc"></p>
          </div>
          <div class="card">
            <div class="icon">02</div>
            <h3 data-i18n="services.card2.title"></h3>
            <p data-i18n="services.card2.desc"></p>
          </div>
          <div class="card">
            <div class="icon">03</div>
            <h3 data-i18n="services.card3.title"></h3>
            <p data-i18n="services.card3.desc"></p>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="why">
        <div class="section-header">
          <h2 class="section-title" data-i18n="why.title"></h2>
          <p class="section-subtitle" data-i18n="why.subtitle"></p>
        </div>
        <div class="grid grid-4">
          <div class="card">
            <div class="icon">✓</div>
            <h3 data-i18n="why.card1.title"></h3>
            <p data-i18n="why.card1.desc"></p>
          </div>
          <div class="card">
            <div class="icon">✓</div>
            <h3 data-i18n="why.card2.title"></h3>
            <p data-i18n="why.card2.desc"></p>
          </div>
          <div class="card">
            <div class="icon">✓</div>
            <h3 data-i18n="why.card3.title"></h3>
            <p data-i18n="why.card3.desc"></p>
          </div>
          <div class="card">
            <div class="icon">✓</div>
            <h3 data-i18n="why.card4.title"></h3>
            <p data-i18n="why.card4.desc"></p>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="process">
        <div class="section-header">
          <h2 class="section-title" data-i18n="process.title"></h2>
          <p class="section-subtitle" data-i18n="process.subtitle"></p>
        </div>
        <div class="process-steps">
          <div class="card process-step">
            <div>
              <h3 data-i18n="process.step1.title"></h3>
              <p data-i18n="process.step1.desc"></p>
            </div>
          </div>
          <div class="card process-step">
            <div>
              <h3 data-i18n="process.step2.title"></h3>
              <p data-i18n="process.step2.desc"></p>
            </div>
          </div>
          <div class="card process-step">
            <div>
              <h3 data-i18n="process.step3.title"></h3>
              <p data-i18n="process.step3.desc"></p>
            </div>
          </div>
          <div class="card process-step">
            <div>
              <h3 data-i18n="process.step4.title"></h3>
              <p data-i18n="process.step4.desc"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="offers">
        <div class="section-header">
          <h2 class="section-title" data-i18n="offers.title"></h2>
          <p class="section-subtitle" data-i18n="offers.subtitle"></p>
        </div>
        <div class="offers">
          <div class="offer">
            <h3 data-i18n="offers.starter.title"></h3>
            <p class="price" data-i18n="offers.starter.price"></p>
            <ul>
              <li data-i18n="offers.starter.point1"></li>
              <li data-i18n="offers.starter.point2"></li>
              <li data-i18n="offers.starter.point3"></li>
            </ul>
            <a class="cta" href="#contact" data-i18n="offers.cta"></a>
          </div>
          <div class="offer highlight">
            <h3 data-i18n="offers.pro.title"></h3>
            <p class="price" data-i18n="offers.pro.price"></p>
            <ul>
              <li data-i18n="offers.pro.point1"></li>
              <li data-i18n="offers.pro.point2"></li>
              <li data-i18n="offers.pro.point3"></li>
            </ul>
            <a class="cta" href="#contact" data-i18n="offers.cta"></a>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="portfolio">
        <div class="section-header">
          <h2 class="section-title" data-i18n="portfolio.title"></h2>
          <p class="section-subtitle" data-i18n="portfolio.subtitle"></p>
        </div>
        <div class="portfolio">
          <div class="portfolio-item">
            <h3 data-i18n="portfolio.item1.title"></h3>
            <p data-i18n="portfolio.item1.desc"></p>
          </div>
          <div class="portfolio-item">
            <h3 data-i18n="portfolio.item2.title"></h3>
            <p data-i18n="portfolio.item2.desc"></p>
          </div>
          <div class="portfolio-item">
            <h3 data-i18n="portfolio.item3.title"></h3>
            <p data-i18n="portfolio.item3.desc"></p>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="about">
        <div class="section-header">
          <h2 class="section-title" data-i18n="about.title"></h2>
          <p class="section-subtitle" data-i18n="about.subtitle"></p>
        </div>
        <div class="about">
          <div>
            <p data-i18n="about.copy"></p>
            <div class="stats">
              <div class="stat-card" data-i18n="about.stat1"></div>
              <div class="stat-card" data-i18n="about.stat2"></div>
              <div class="stat-card" data-i18n="about.stat3"></div>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="about.side.title"></h3>
            <p data-i18n="about.side.desc"></p>
            <ul>
              <li data-i18n="about.side.point1"></li>
              <li data-i18n="about.side.point2"></li>
              <li data-i18n="about.side.point3"></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="section fade-in" id="contact">
        <div class="section-header">
          <h2 class="section-title" data-i18n="contact.title"></h2>
          <p class="section-subtitle" data-i18n="contact.subtitle"></p>
        </div>
        <form class="contact-form" action="https://formsubmit.co/contact@ravensy.com" method="POST">
          <input type="hidden" name="_captcha" value="false" />
          <input type="text" name="name" required data-i18n-placeholder="contact.name" />
          <input type="email" name="email" required data-i18n-placeholder="contact.email" />
          <textarea name="message" required data-i18n-placeholder="contact.message"></textarea>
          <input class="cta" type="submit" data-i18n-value="contact.submit" />
        </form>
      </section>
    </main>

    <footer class="footer" data-i18n="footer"></footer>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/language.js"></script>
  </body>
</html>
